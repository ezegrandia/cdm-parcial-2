  <script>
    window.__APP_ERRORS__ = [];
    window.__showAppError = function (msg) {
      window.__APP_ERRORS__.push(String(msg));
      var paint = function () {
        var el = document.getElementById('appError');
        if (!el) {
          el = document.createElement('div');
          el.id = 'appError';
          el.className = 'app-error';
          document.body.appendChild(el);
        }
        el.hidden = false;
        el.textContent = '⚠ Error JS: ' + msg;
      };
      if (document.body) paint();
      else document.addEventListener('DOMContentLoaded', paint, { once: true });
    };
    window.addEventListener('error', function (e) { window.__showAppError(e.message || 'error'); });
    window.addEventListener('unhandledrejection', function (e) { window.__showAppError(e.reason && e.reason.message ? e.reason.message : e.reason); });
  </script>

  <script>
    /* Si se abre con doble clic (file://), los módulos ES no cargan: se usa el
       bundle clásico generado por tools/build-bundle.mjs. Servida por HTTP(S),
       la app usa los módulos nativos. */
    (function () {
      var script = document.createElement('script');
      var isFile = window.location.protocol === 'file:';
      if (isFile) {
        script.src = './js/bundle.js';
      } else {
        script.type = 'module';
        script.src = './js/main.js';
      }
      script.onerror = function () {
        var box = document.createElement('div');
        box.className = 'app-error';
        box.textContent = isFile
          ? 'No se pudo cargar js/bundle.js. Generá el bundle con: node tools/build-bundle.mjs'
          : 'No se pudo cargar js/main.js. Revisá que la carpeta js/ esté completa.';
        document.body.appendChild(box);
      };
      document.body.appendChild(script);
    })();
  </script>
